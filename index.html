<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gechang | Personal Homepage</title>
  <meta name="description" content="gechang 的个人主页">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #20242b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(760px, calc(100% - 48px));
      margin: 0 auto;
      padding: 112px 0 64px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 8vw, 60px);
      font-weight: 500;
      letter-spacing: -1.8px;
    }

    section {
      margin-top: 72px;
    }

    h2 {
      margin: 0 0 22px;
      color: #343a43;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .education {
      padding: 18px 0;
      border-top: 1px solid #e8ebef;
      border-bottom: 1px solid #e8ebef;
    }

    .school {
      font-size: 16px;
      font-weight: 550;
    }

    .degree {
      margin-top: 7px;
      color: #6b7280;
      font-size: 14px;
    }

    footer {
      margin-top: 112px;
      padding-top: 20px;
      border-top: 1px solid #e8ebef;
      color: #8a9099;
      font-size: 13px;
    }

    @media (max-width: 560px) {
      main {
        padding-top: 76px;
      }

      section {
        margin-top: 56px;
      }

      footer {
        margin-top: 88px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>gechang</h1>
    </header>

    <section aria-labelledby="education-heading">
      <h2 id="education-heading">教育经历</h2>
      <div class="education">
        <div class="school">中山大学</div>
        <div class="degree">本科</div>
      </div>
    </section>

    <footer>© <span id="year"></span> gechang</footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
